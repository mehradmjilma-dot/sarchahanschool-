name: Build Sarchahan School APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        working-directory: mobile
        run: flutter create --platforms=android --project-name sarchahan_school .

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: sarchahan-school-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
